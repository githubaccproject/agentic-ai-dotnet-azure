name: Azure TelecomIQ
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Azure operation
        type: choice
        options:
          - verify
          - discover-models
          - preview
          - deploy-free
          - preview-trial
          - deploy-trial
        default: verify
      enable_search:
        type: boolean
        default: false
      enable_document_intelligence:
        type: boolean
        default: false
      confirm_trial:
        description: Type USE-TRIAL-CREDITS for deploy-trial
        type: string
        default: ''
      openai_location:
        type: string
        default: eastus
      chat_version:
        type: string
        default: '2025-04-14'
      chat_model:
        type: string
        default: gpt-4.1-mini
      chat_sku:
        type: string
        default: GlobalStandard
      embedding_sku:
        type: string
        default: Standard
      embedding_version:
        type: string
        default: '1'
permissions:
  contents: read
  id-token: write
concurrency:
  group: telecomiq-azure
  cancel-in-progress: false
jobs:
  azure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: azure-dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify scoped access
        run: az group show --name rg-telecomiq-dev --query provisioningState -o tsv
      - name: Verify deployed inventory
        if: inputs.operation == 'verify'
        run: |
          set -euo pipefail
          rg=rg-telecomiq-dev
          az resource list -g "$rg" --query '[].{name:name,type:type,region:location}' -o table
          az deployment group show -g "$rg" -n trial --query properties.provisioningState -o tsv
          az cognitiveservices account deployment list -g "$rg" -n aoai-tq-fxwt5ietl6nyc --query '[].{name:name,model:properties.model.name,version:properties.model.version,state:properties.provisioningState}' -o table
          az servicebus queue show -g "$rg" --namespace-name sb-tq-fxwt5ietl6nyc -n contract-jobs --query '{name:name,status:status,maxDeliveryCount:maxDeliveryCount}' -o json
          storage=$(az storage account show -g "$rg" -n sttqfxwt5ietl6nyc --query id -o tsv)
          arm=$(az cloud show --query endpoints.resourceManager -o tsv)
          for name in contracts policies; do
            az rest --method get --url "${arm%/}${storage}/blobServices/default/containers/${name}?api-version=2023-05-01" --query '{name:name,publicAccess:properties.publicAccess}' -o json
          done
          az search service show -g "$rg" -n telecomiq-fxwt5ietl6nyc --query '{name:name,sku:sku.name,state:provisioningState,disableLocalAuth:disableLocalAuth}' -o json
          az cognitiveservices account show -g "$rg" -n telecomiq-di-fxwt5ietl6nyc --query '{name:name,sku:sku.name,state:properties.provisioningState}' -o json
          az rest --method get --resource https://search.azure.com --url 'https://telecomiq-fxwt5ietl6nyc.search.windows.net/indexes?api-version=2024-07-01&%24select=name' --query 'value[].name' -o json
      - name: Preview or deploy free resources
        if: inputs.operation == 'preview' || inputs.operation == 'deploy-free'
        env:
          OPERATION: ${{ inputs.operation }}
          ENABLE_SEARCH: ${{ inputs.enable_search }}
          ENABLE_DI: ${{ inputs.enable_document_intelligence }}
        run: |
          set -euo pipefail
          az deployment group what-if --resource-group rg-telecomiq-dev --template-file deploy/main.bicep --parameters enableSearch="$ENABLE_SEARCH" enableDocumentIntelligence="$ENABLE_DI"
          if [[ "$OPERATION" == deploy-free ]]; then
            az deployment group create --resource-group rg-telecomiq-dev --template-file deploy/main.bicep --parameters enableSearch="$ENABLE_SEARCH" enableDocumentIntelligence="$ENABLE_DI" --output none
          fi
      - name: Preview or deploy trial resources
        if: inputs.operation == 'preview-trial' || inputs.operation == 'deploy-trial'
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRM: ${{ inputs.confirm_trial }}
          AI_LOCATION: ${{ inputs.openai_location }}
          CHAT_MODEL: ${{ inputs.chat_model }}
          CHAT_SKU: ${{ inputs.chat_sku }}
          EMBEDDING_SKU: ${{ inputs.embedding_sku }}
          CHAT_VERSION: ${{ inputs.chat_version }}
          EMBEDDING_VERSION: ${{ inputs.embedding_version }}
        run: |
          set -euo pipefail
          if [[ "$OPERATION" == deploy-trial && "$CONFIRM" != USE-TRIAL-CREDITS ]]; then
            echo "Explicit trial credit confirmation required."
            exit 1
          fi
          az deployment group what-if --resource-group rg-telecomiq-dev --template-file deploy/trial.bicep --parameters openAiLocation="$AI_LOCATION" chatModel="$CHAT_MODEL" chatSku="$CHAT_SKU" embeddingSku="$EMBEDDING_SKU" chatVersion="$CHAT_VERSION" embeddingVersion="$EMBEDDING_VERSION"
          if [[ "$OPERATION" == deploy-trial ]]; then
            az deployment group create --resource-group rg-telecomiq-dev --template-file deploy/trial.bicep --parameters openAiLocation="$AI_LOCATION" chatModel="$CHAT_MODEL" chatSku="$CHAT_SKU" embeddingSku="$EMBEDDING_SKU" chatVersion="$CHAT_VERSION" embeddingVersion="$EMBEDDING_VERSION" --query properties.outputs -o json
          fi
      - name: Discover regional OpenAI models
        if: inputs.operation == 'discover-models'
        env:
          AI_LOCATION: ${{ inputs.openai_location }}
        run: |
          az cognitiveservices model list --location "$AI_LOCATION" --query "[?kind=='OpenAI' && (model.name=='gpt-4.1-mini' || model.name=='gpt-5-mini' || model.name=='text-embedding-3-small')].{Model:model.name,Version:model.version,SKUs:model.skus,Lifecycle:model.lifecycleStatus}" -o json
