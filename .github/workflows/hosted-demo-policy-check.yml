name: TelecomIQ policy upload check
on:
  push:
    branches: [codex/publish-main-c13858b]
    paths: [.github/workflows/hosted-demo-policy-check.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: telecomiq-hosted-demo
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    environment: azure-dev
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Measure outbound IP and TLS from the app container
        env:
          ATLAS_NODE: ac-680hukg-shard-00-00.pj54qnu.mongodb.net
        shell: bash
        run: |
          set -euo pipefail
          group=rg-telecomiq-dev
          app=telecomiq-demo-x6ub3bqyhbii6
          tmp=$(mktemp -d)
          trap 'rm -rf -- "$tmp"' EXIT
          probe="{ printf 'Runtime outbound IPv4: '; curl -4 -fsS --max-time 7 https://api.ipify.org; printf '\\nAtlas TLS result:\\n'; timeout 10 openssl s_client -connect $ATLAS_NODE:27017 -servername $ATLAS_NODE -verify_return_error -brief -CApath /etc/ssl/certs </dev/null; result=\$?; printf '\\nTLS probe exit: %s\\n' \"\$result\"; } > /home/LogFiles/telecomiq-atlas-runtime-check.log 2>&1"
          timeout 25 az webapp exec -g "$group" -n "$app" --mode execute --shell /bin/sh --shell-command "$probe" --only-show-errors -o none
          sleep 12
          timeout 60 az webapp log download -g "$group" -n "$app" --log-file "$tmp/probe.zip" --only-show-errors -o none
          unzip -p "$tmp/probe.zip" '*telecomiq-atlas-runtime-check.log' |
            grep -Ei 'Runtime outbound IPv4|Atlas TLS result|TLS probe exit|CONNECTION ESTABLISHED|Protocol version|Verification:|alert|SSL|certificate|network|timed out|refused|not found'
