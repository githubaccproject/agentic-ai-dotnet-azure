name: TelecomIQ policy upload check
on:
  push:
    branches: [codex/publish-main-c13858b]
    paths: [.github/workflows/hosted-demo-policy-check.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: telecomiq-hosted-demo
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    environment: azure-dev
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Check Atlas connectivity through App Service settings and telemetry
        env:
          ATLAS_HOST: telecomiq-demo.pj54qnu.mongodb.net
        shell: bash
        run: |
          set -euo pipefail
          app=telecomiq-demo-x6ub3bqyhbii6
          group=rg-telecomiq-dev
          tmp=$(mktemp -d)
          trap 'rm -rf -- "$tmp"' EXIT
          ips=$(az webapp show -g "$group" -n "$app" --query '[outboundIpAddresses, possibleOutboundIpAddresses]' -o tsv)
          echo "App Service outbound address sets:"
          printf '%s\n' "$ips"
          mongo=$(az webapp config appsettings list -g "$group" -n "$app" --query "[?name=='Mongo__ConnectionString'].value | [0]" -o tsv)
          printf '%s' "$mongo" | python3 -c 'import sys, urllib.parse
          try:
              uri = urllib.parse.urlsplit(sys.stdin.read().strip())
              print("Atlas SRV hostname matches the application:", uri.scheme == "mongodb+srv" and uri.hostname == sys.argv[1])
          except ValueError:
              print("App Service MongoDB URI could not be parsed.")
          ' "$ATLAS_HOST"
          db=$(az webapp config appsettings list -g "$group" -n "$app" --query "[?name=='Mongo__Database'].value | [0]" -o tsv)
          [[ "$db" != "telecomiq-demo" ]] || echo "The App Service points to the expected database."
          component=$(az resource list -g "$group" --resource-type Microsoft.Insights/components --query "[?name=='$app'].id | [0]" -o tsv)
          if [[ -z "$component" ]]; then
            echo "The matching Application Insights resource was not found in the demo resource group."
            exit 0
          fi
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors > /dev/null 2>&1
          query="exceptions | where operation_Id == '9a3d4dcc602b529fa626ccb3ed2e29a0' | project type, outerMessage, innermostMessage, details | take 5"
          if timeout 80 az monitor app-insights query --ids "$component" --analytics-query "$query" --offset 6h --only-show-errors -o json > "$tmp/in.json" 2>"$tmp/cli.err"; then
            python3 - "$tmp/in.json" <<'PY'
          import json, re, sys
          rows = json.load(open(sys.argv[1]))
          raw = json.dumps(rows)
          markers = [
              'MongoConnectionException', 'MongoAuthenticationException', 'AuthenticationException',
              'MongoCommandException', 'SocketException', 'Connection reset by peer', 'Connection refused',
              'Network is unreachable', 'No route to host', 'Operation timed out', 'Connection timed out',
              'RemoteCertificateNameMismatch', 'RemoteCertificateChainErrors', 'certificate', 'TLS',
              'SSL connection', 'EndOfStreamException', 'unexpected EOF', 'forcibly closed',
              'Resource temporarily unavailable', 'Name or service not known', 'Try again', 'Authentication failed',
              'no such host', 'Cannot assign requested address', 'TimeoutException', 'Unknown host',
              'Disconnected', 'ReplicaSetNoPrimary', 'HeartBeatException', 'HeartbeatException',
          ]
          print("Application Insights evidence:", ", ".join(m for m in markers if m.lower() in raw.lower()) or "No matching exception details found.")
          codes = sorted(set(re.findall(r'SocketException\s*\(([0-9]+)\)', raw)))
          if codes:
              print("Socket error codes:", ", ".join(codes))
          PY
          else
            if grep -qiE 'Forbidden|AuthorizationFailed|InsufficientAccessError' "$tmp/cli.err"; then
              echo "The deployment identity cannot query Application Insights."
            else
              echo "Application Insights query did not complete."
            fi
          fi
