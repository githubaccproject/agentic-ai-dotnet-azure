name: TelecomIQ hosted demo
run-name: Publish TelecomIQ from main 7261885
on:
  push:
    branches: [codex/publish-main-c13858b]
    paths: [.github/workflows/hosted-demo.yml]

permissions:
  contents: read
  id-token: write
concurrency:
  group: telecomiq-hosted-demo
  cancel-in-progress: false

jobs:
  app:
    runs-on: ubuntu-latest
    environment: azure-dev
    env:
      RESOURCE_GROUP: rg-telecomiq-dev
      DEPLOYMENT: telecomiq-hosted-demo
      QUEUE: hosted-demo-jobs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7261885aab0cc1502efec9e8e87879cb612ea87a
          persist-credentials: false
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify host and configure the demo
        id: host
        env:
          MONGO_URL: ${{ secrets.DEMO_MONGO_CONNECTION_STRING }}
        run: bash deploy/configure-hosted-demo.sh

      - name: Build release package
        run: |
          npm --prefix frontend install --no-audit --no-fund
          bash deploy/package-hosted-demo.sh "$RUNNER_TEMP/telecomiq-hosted-demo.zip"

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.host.outputs.app_name }}
          package: ${{ runner.temp }}/telecomiq-hosted-demo.zip

      - name: Check anonymous access
        env:
          HOST: ${{ steps.host.outputs.hostname }}
        run: |
          set -euo pipefail
          for path in / /api/policies /swagger/index.html; do
            status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' "https://$HOST$path")
            case "$status" in
              301|302|303|307|308|401|403) ;;
              *) echo "Expected a sign-in or denial for $path, got HTTP $status"; exit 1;;
            esac
          done
          echo "Open https://$HOST and sign in with the allowlisted account." >> "$GITHUB_STEP_SUMMARY"
