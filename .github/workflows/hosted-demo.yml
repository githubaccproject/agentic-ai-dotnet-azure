name: TelecomIQ hosted demo
on:
  push:
    branches: [codex/azure-demo-bootstrap]
    paths: [.github/workflows/hosted-demo.yml, deploy/hosted-demo.bicep]
  workflow_dispatch:
    inputs:
      operation:
        description: Free App Service operation
        type: choice
        options: [preview, provision, configure-auth, publish]
        default: preview

permissions:
  contents: read
  id-token: write
concurrency:
  group: telecomiq-hosted-demo
  cancel-in-progress: false

jobs:
  app:
    runs-on: ubuntu-latest
    environment: azure-dev
    env:
      RESOURCE_GROUP: rg-telecomiq-dev
      DEPLOYMENT: telecomiq-hosted-demo
      QUEUE: hosted-demo-jobs
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Preview or provision the closed free host
        if: github.event_name == 'push' || inputs.operation == 'preview' || inputs.operation == 'provision'
        env:
          OPERATION: ${{ github.event_name == 'push' && 'provision' || inputs.operation }}
        run: |
          set -euo pipefail
          if az deployment group show --resource-group "$RESOURCE_GROUP" --name "$DEPLOYMENT" \
            --query "properties.provisioningState=='Succeeded'" -o tsv 2>/dev/null | grep -qi '^true$'; then
            echo "The demo host already exists."
            exit 0
          fi
          if [[ "$OPERATION" == provision ]]; then
            state=$(az provider show --namespace Microsoft.Web --query registrationState -o tsv --only-show-errors || true)
            if [[ "$state" != Registered ]]; then
              if ! timeout 180 az provider register --namespace Microsoft.Web --wait --only-show-errors; then
                echo "An administrator can register Microsoft.Web on the Azure subscription, then rerun this job."
                exit 1
              fi
            fi
          fi
          az deployment group what-if -g "$RESOURCE_GROUP" -f deploy/hosted-demo.bicep --result-format ResourceIdOnly
          if [[ "$OPERATION" == provision ]]; then
            az deployment group create -g "$RESOURCE_GROUP" -n "$DEPLOYMENT" \
              -f deploy/hosted-demo.bicep --query properties.outputs -o json
            hostname=$(az deployment group show -g "$RESOURCE_GROUP" -n "$DEPLOYMENT" \
              --query properties.outputs.hostname.value -o tsv)
            echo "Closed F1 host provisioned at $hostname." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure Entra sign-in
        if: inputs.operation == 'configure-auth'
        env:
          ENTRA_CLIENT_ID: ${{ vars.DEMO_ENTRA_CLIENT_ID }}
          REVIEWER_ID: ${{ vars.DEMO_REVIEWER_OBJECT_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.DEMO_ENTRA_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          : "${ENTRA_CLIENT_ID:?Set DEMO_ENTRA_CLIENT_ID}"
          : "${REVIEWER_ID:?Set DEMO_REVIEWER_OBJECT_ID}"
          : "${ENTRA_CLIENT_SECRET:?Set DEMO_ENTRA_CLIENT_SECRET}"
          app=$(az deployment group show -g "$RESOURCE_GROUP" -n "$DEPLOYMENT" \
            --query properties.outputs.name.value -o tsv)
          : "${app:?Provision the F1 host first}"
          enabled=$(az webapp config appsettings list -g "$RESOURCE_GROUP" -n "$app" \
            --query "[?name=='HostedDemo__Enabled'].value | [0]" -o tsv)
          if [[ "$enabled" == true ]]; then
            echo "The demo is already published. Manage sign-in settings on the app."
            exit 1
          fi
          config=$(mktemp)
          trap 'rm -f -- "$config"' EXIT
          jq -n '{
            configureAuth: {value: true},
            entraClientId: {value: env.ENTRA_CLIENT_ID},
            reviewerObjectId: {value: env.REVIEWER_ID},
            entraClientSecret: {value: env.ENTRA_CLIENT_SECRET}
          }' > "$config"
          az deployment group what-if -g "$RESOURCE_GROUP" -f deploy/hosted-demo.bicep \
            -p "@$config" --result-format ResourceIdOnly
          az deployment group create -g "$RESOURCE_GROUP" -n "$DEPLOYMENT" \
            -f deploy/hosted-demo.bicep -p "@$config" --query properties.outputs -o json

      - uses: actions/setup-dotnet@v4
        if: inputs.operation == 'publish'
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        if: inputs.operation == 'publish'
        with:
          node-version: '22'

      - name: Verify host and configure the demo
        id: host
        if: inputs.operation == 'publish'
        env:
          MONGO_URL: ${{ secrets.DEMO_MONGO_CONNECTION_STRING }}
        run: bash deploy/configure-hosted-demo.sh

      - name: Build release package
        if: inputs.operation == 'publish'
        run: |
          npm --prefix frontend install --no-audit --no-fund
          bash deploy/package-hosted-demo.sh "$RUNNER_TEMP/telecomiq-hosted-demo.zip"

      - uses: azure/webapps-deploy@v3
        if: inputs.operation == 'publish'
        with:
          app-name: ${{ steps.host.outputs.app_name }}
          package: ${{ runner.temp }}/telecomiq-hosted-demo.zip

      - name: Check anonymous access
        if: inputs.operation == 'publish'
        env:
          HOST: ${{ steps.host.outputs.hostname }}
        run: |
          set -euo pipefail
          for path in / /api/policies /swagger/index.html; do
            status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' "https://$HOST$path")
            case "$status" in
              301|302|303|307|308|401|403) ;;
              *) echo "Expected a sign-in or denial for $path, got HTTP $status"; exit 1;;
            esac
          done
          echo "Open https://$HOST and sign in with the allowlisted account." >> "$GITHUB_STEP_SUMMARY"
